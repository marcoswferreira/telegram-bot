services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/telegram-bot", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
