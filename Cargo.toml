[package]
name = "telegram-bot"
version = "0.1.0"
edition = "2021"
description = "Lightweight HTTP-to-Telegram relay service"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
grammers-client = "0.12"
grammers-session = "0.12"
grammers-tl-types = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
